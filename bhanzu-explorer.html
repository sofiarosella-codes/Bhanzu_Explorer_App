  <dialog id="settings"><form id="settings-form"><h2>Your adventure details</h2><p>Use the class date confirmed by your onboarding team.</p><label>Explorer nickname <input name="nickname" maxlength="30" autocomplete="off"></label><label>Onboarding date <input name="onboard" type="date" required></label><label>First class date <input name="start" type="date" required></label><label>Your grade <select name="grade" required></select></label><p class="error" id="settings-error" role="alert"></p><div class="actions"><button class="primary" type="submit">Save details</button><button type="button" id="close-settings">Cancel</button></div><hr><button class="danger" type="button" id="reset">Start over on this device</button></form></dialog>

<script>
(function (root) {
  'use strict';
  const DAY=86400000;
  function validDate(s){if(typeof s!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(s))return false;const [y,m,d]=s.split('-').map(Number);const t=new Date(Date.UTC(y,m-1,d));return t.getUTCFullYear()===y&&t.getUTCMonth()===m-1&&t.getUTCDate()===d;}
  function dayNumber(s){if(!validDate(s))throw new Error('Invalid date');const [y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d)/DAY;}
  function today(now=new Date()){return [now.getFullYear(),String(now.getMonth()+1).padStart(2,'0'),String(now.getDate()).padStart(2,'0')].join('-');}
  function addDays(s,n){const d=new Date((dayNumber(s)+n)*DAY);return d.toISOString().slice(0,10);}
  function status(profile,date=today()){const elapsed=Math.max(0,dayNumber(date)-dayNumber(profile.onboard));const left=dayNumber(profile.start)-dayNumber(date);return {elapsed,left,started:left<=0,beforeOnboarding:date<profile.onboard};}
  function unlockOffset(mission,profile){return mission.final?Math.max(0,dayNumber(profile.start)-dayNumber(profile.onboard)-2):mission.day;}
  function available(mission,profile,date=today()){const s=status(profile,date);return !s.started&&!s.beforeOnboarding&&s.elapsed>=unlockOffset(mission,profile);}
  function validateProfile(p){return !!p&&typeof p.nickname==='string'&&p.nickname.length<=30&&validDate(p.onboard)&&validDate(p.start)&&p.start>=p.onboard&&['starter','challenger'].includes(p.level)&&['space','detective','sports'].includes(p.avatar);}
  const Q=(question,options,answer,hint,explanation)=>({question,options,answer,hint,explanation});
  const missions=[
    {id:'passport',day:0,week:1,icon:'🎒',title:'Your explorer passport',kind:'play',prompt:'Choose one thing you are curious about. Tell a grown-up: “I want to discover…”',hint:'It could be space, sports, shapes or a tricky number!',explanation:'Curiosity is a wonderful place to begin. Your passport records adventures you try, not test scores.',benefit:'Talking about interests gives the child a voice in their learning.'},

 function validArtifact(a){return object(a)&&((a.type==='paint'&&[6,8].includes(a.size)&&Array.isArray(a.pixels)&&a.pixels.length===a.size*a.size&&a.pixels.every(v=>Number.isInteger(v)&&v>=0&&v<=4))||(a.type==='postcard'&&typeof a.text==='string'&&a.text.length<=220&&typeof a.mood==='string'));}
 function passport(){const count=done().length,art=missions().map(m=>({m,a:state.artifacts[draftKey(m.id)]})).filter(x=>validArtifact(x.a));return `<section class="panel passport"><div class="eyebrow">Your actual creations, saved here</div><h3>${avatars[state.profile.avatar]} ${esc(state.profile.nickname)}</h3><p class="small">Grade ${state.profile.grade} passport</p>${art.length?`<div class="art-gallery">${art.map(({m,a})=>`<figure><figcaption>${esc(m.title)}</figcaption>${S.artwork(a,true)}<button class="export-art" data-export="${m.id}">Download ${a.type==='paint'?'artwork':'postcard'}</button></figure>`).join('')}</div>`:'<div class="empty-art">🎨<p>Your creations will appear here.<br>Start with “Save artwork to my passport”.</p></div>'}<div class="stamps">${[1,2,3,4].map(w=>`<span class="stamp ${missions().some(m=>m.week===w&&done().includes(m.id))?'earned':''}" aria-label="Week ${w} stamp">${['🔎','🧩','💡','🌟'][w-1]}</span>`).join('')}</div><div class="progress" role="progressbar" aria-label="Completed activities" aria-valuenow="${count}" aria-valuemin="0" aria-valuemax="15"><span style="width:${count/15*100}%"></span></div><p>${count} of 15 activities saved</p><p class="small muted">Your grade has its own progress and gallery. Change grades without erasing earlier work.</p><button id="print-passport">Print passport</button></section>`;}
 function bindPassport(){document.getElementById('print-passport').onclick=()=>window.print();document.querySelectorAll('[data-export]').forEach(b=>b.onclick=()=>exportArt(b.dataset.export));}
 function exportArt(id){const a=state.artifacts[draftKey(id)];if(!validArtifact(a))return;let blob,ext;if(a.type==='paint'){const colours=['#ffffff','#8150af','#fc846d','#f6c847','#7bc5aa'];const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${a.size} ${a.size}" width="800" height="800">${a.pixels.map((v,i)=>`<rect x="${i%a.size}" y="${Math.floor(i/a.size)}" width="1" height="1" fill="${colours[v]}"/>`).join('')}</svg>`;blob=new Blob([svg],{type:'image/svg+xml'});ext='svg';}else{blob=new Blob([a.mood+'\n\n'+a.text],{type:'text/plain'});ext='txt';}const url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=`grade-${state.profile.grade}-${id}.${ext}`;link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
 function sidebar(){return `<div id="passport-slot">${passport()}</div><section class="panel guide"><span class="guide-icon">🦉</span><h3>Explorer Guide</h3><p class="small">Prepared help, not a live teacher.</p><div class="guide-answer" id="guide-answer" role="status">Pick any activity. Hints are available, and your creations can be saved in your passport.</div><div class="quick-replies"><button data-guide="hint">A hint</button><button data-guide="save">How do I save?</button><button data-guide="class">Class details</button></div></section><section class="panel parent-note"><h3>Designed for Grade ${state.profile.grade}</h3><p>Activities combine creative play and grade-specific challenge settings. They are examples, not an official Bhanzu curriculum.</p><p class="small muted">Grades 1–2: discovery · 3–5: creative problem-solving · 6–8: fractions and logic · 9–12: design, functions and algebra.</p></section>`;}
 function details(){const m=missions().find(x=>x.id===selected)||missions()[0],idx=missions().findIndex(x=>x.id===m.id);return `<section class="panel detail" id="mission-detail"><div class="toolbar"><span class="pill">Grade ${state.profile.grade} · ${m.band}</span><span id="completion-chip" class="small">${done().includes(m.id)?'✓ Saved to passport':'Create at your own pace'}</span></div><h2>${m.icon} ${m.title}</h2><p class="question">${esc(m.prompt)}</p><div class="game" id="studio"><div class="game-label">YOUR PLAY SPACE</div><div class="studio-board"></div><div class="game-status" role="status">Explore at your own pace. No timer.</div></div><div class="actions"><button id="hint">Show a hint</button><button id="previous" ${idx===0?'disabled':''}>← Previous</button><button id="next" class="primary" ${idx===14?'disabled':''}>Next activity →</button></div><p class="benefit"><strong>What this practises:</strong> ${esc(m.benefit)}</p></section>`;}
 function record(id,artifact){if(E.status(state.profile).started){render();return;}if(!done().includes(id))state.progress[gradeKey()]=[...done(),id];if(artifact)state.artifacts[draftKey(id)]=structuredClone(artifact);save();document.getElementById('passport-slot').innerHTML=passport();bindPassport();document.getElementById('completion-chip').textContent=storageOK?'✓ Saved to passport':'Created · browser could not save';document.querySelectorAll(`[data-mission="${id}"]`).forEach(b=>{b.classList.add('done');b.querySelector('.state').textContent='✓ Saved';});const picker=document.getElementById('mission-picker');if(picker)picker.querySelector(`option[value="${id}"]`).textContent='✓ '+missions().find(m=>m.id===id).title;}
 function bindDetail(){const m=missions().find(x=>x.id===selected);const key=draftKey(selected);S.mount(document.getElementById('studio'),m,state.drafts[key],{draft:d=>{state.drafts[key]=d;save();},complete:a=>record(m.id,a)});document.getElementById('hint').onclick=()=>{document.querySelector('.game-status').textContent=m.hint;};const idx=missions().findIndex(x=>x.id===selected);document.getElementById('previous').onclick=()=>select(missions()[idx-1].id);document.getElementById('next').onclick=()=>select(missions()[idx+1].id);}
 function select(id){selected=id;render();document.getElementById('mission-detail')?.scrollIntoView({block:'start',behavior:'instant'});}
 function journey(){const status=E.status(state.profile);app.innerHTML=`<div class="toolbar"><span class="pill">${status.left} days until your saved class date</span><label class="grade-picker">Your grade <select id="grade-picker">${options(state.profile.grade)}</select></label><button id="settings-button">Settings</button></div>${hero()}<div class="activity-navigation"><label for="mission-picker">Choose any activity — all 15 are open</label><select id="mission-picker">${missions().map(m=>`<option value="${m.id}" ${selected===m.id?'selected':''}>${done().includes(m.id)?'✓ ':''}${esc(m.title)}</option>`).join('')}</select></div><div class="layout"><div>${details()}<div class="roadmap-wrap"><h2>Your month of possibilities</h2><p class="small muted">Suggested weekly pacing. You can complete activities in any order.</p>${[1,2,3,4].map(w=>`<h3 class="week-title">Week ${w}</h3><div class="roadmap">${missions().filter(m=>m.week===w).map(m=>`<button class="mission-tile ${done().includes(m.id)?'done':''} ${selected===m.id?'active':''}" data-mission="${m.id}" aria-pressed="${selected===m.id}"><span class="day">Suggested day ${m.day+1}</span><span class="icon">${m.icon}</span><span>${esc(m.title)}</span><span class="state">${done().includes(m.id)?'✓ Saved':'Open activity →'}</span></button>`).join('')}</div>`).join('')}</div></div><aside class="side">${sidebar()}</aside></div>`;
 document.getElementById('mission-picker').onchange=e=>select(e.target.value);document.getElementById('grade-picker').onchange=e=>{adoptGrade(+e.target.value);selected='passport';render();};document.querySelectorAll('[data-mission]').forEach(b=>b.onclick=()=>select(b.dataset.mission));document.getElementById('settings-button').onclick=openSettings;bindPassport();bindDetail();document.querySelectorAll('[data-guide]').forEach(b=>b.onclick=()=>{const m=missions().find(x=>x.id===selected);document.getElementById('guide-answer').textContent=b.dataset.guide==='hint'?m.hint:b.dataset.guide==='save'?'Finish a game to save its stamp automatically. For paintings and postcards, use the Save to passport button. You can edit and save artwork again. Drafts are saved as you work on this device.':`Your saved class date is ${dateLabel(state.profile.start)}. Use the time and joining link sent by Bhanzu. This app cannot verify a booking.`;});}
 function started(){app.innerHTML=`<section class="panel complete-hero"><span class="big">🎉</span><h1>Your next adventure: class!</h1><p>Your saved class date is ${dateLabel(state.profile.start)}. New pre-class activities have stopped. Your artwork and passport are still here.</p><p>Use the joining link and class time sent by your Bhanzu team.</p><button id="settings-button">Update class date or grade</button></section><div id="passport-slot" style="max-width:600px;margin:24px auto">${passport()}</div>`;document.getElementById('settings-button').onclick=openSettings;bindPassport();}
 function render(){S.dispose();if(!state.profile)setup();else if(!gradeOK(state.profile.grade))migrateGrade();else if(E.status(state.profile).started)started();else journey();if(!storageOK)save();}
 function openSettings(){const form=document.getElementById('settings-form');for(const k of ['nickname','onboard','start'])form.elements[k].value=state.profile[k];form.elements.grade.innerHTML=options(state.profile.grade);document.getElementById('settings-error').textContent='';document.getElementById('settings').showModal();}
 document.getElementById('close-settings').onclick=()=>document.getElementById('settings').close();document.getElementById('settings-form').onsubmit=e=>{e.preventDefault();const values=Object.fromEntries(new FormData(e.target)),p={...state.profile,...values,grade:+values.grade,nickname:values.nickname.trim()||'Explorer'};if(!gradeOK(p.grade)||!E.validateProfile(p)){document.getElementById('settings-error').textContent='Choose a valid grade and dates. Class must be on or after onboarding.';return;}state.profile=p;adoptGrade(p.grade);document.getElementById('settings').close();render();};
 document.getElementById('reset').onclick=()=>{if(!confirm('Remove all grades, drafts, artwork and passport progress from this browser?'))return;state={profile:null,done:[],progress:{},drafts:{},artifacts:{}};try{localStorage.removeItem(KEY);}catch{}document.getElementById('settings').close();selected='passport';render();};
 let lastDay=E.today();const checkDay=()=>{if(E.today()!==lastDay){lastDay=E.today();render();}};setInterval(checkDay,30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkDay();});render();
})();

</script>
</body>
</html>
